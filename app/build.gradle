plugins {
    id "com.android.application"
}

android {
    namespace "com.hostelmanager"
    compileSdk 35

    defaultConfig {
        applicationId "com.hostelmanager"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDir("$buildDir/generated/validation-limits")
    }
}

def validationLimitsFile = rootProject.file("shared/validation-limits.json")
def generatedValidationLimits = file("$buildDir/generated/validation-limits/com/hostelmanager/ValidationLimits.java")
tasks.register("generateValidationLimits") {
    inputs.file(validationLimitsFile)
    outputs.file(generatedValidationLimits)
    doLast {
        def limits = new groovy.json.JsonSlurper().parse(validationLimitsFile)
        generatedValidationLimits.parentFile.mkdirs()
        def fields = limits.collect { key, value ->
            "    static final int ${key.replaceAll(/([A-Z])/, '_$1').toUpperCase()} = ${value};"
        }.join("\n")
        generatedValidationLimits.text = """package com.hostelmanager;
final class ValidationLimits {
    private ValidationLimits() {}
${fields}
}
"""
    }
}
tasks.named("preBuild").configure {
    dependsOn("generateValidationLimits")
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-appcheck-playintegrity"
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
